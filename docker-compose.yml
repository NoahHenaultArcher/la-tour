services:
  db:
    image: postgres:17-alpine
    container_name: la-tour-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-latour}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-latour}
      POSTGRES_DB: ${POSTGRES_DB:-latour}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
